name: edge

# The one public entry point of the server: Caddy on ports 80/443 with automatic HTTPS for
# production and staging, routing each domain to its app stack over the shared "edge" network.
# Started by deploy/deploy.sh on production deploys (MANAGE_EDGE=true in /opt/survey/.env).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PROD_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in /opt/survey/.env}
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN in /opt/survey/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy-data:
  caddy-config:
