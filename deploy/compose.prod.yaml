name: ${STACK_NAME:-survey}

# One app stack (production: STACK_NAME=survey, staging: survey-staging), started by
# deploy/deploy.sh. Settings come from the stack's .env on the server (see deploy/README.md);
# Compose stops with an error if a required value is missing. The edge proxy (deploy/edge)
# reaches the api and web containers over the shared "edge" network.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-survey_dynata}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-survey_dynata}
      APP_BASE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TRUST_PROXY: 'true'
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-30}
      DYNATA_MODE: ${DYNATA_MODE:-mock}
      DYNATA_SECURITY: ${DYNATA_SECURITY:-start-end}
      DYNATA_END_URL: ${DYNATA_END_URL:-}
      DYNATA_QUALITY_FLAG: ${DYNATA_QUALITY_FLAG:-}
      DYNATA_KEY_ID: ${DYNATA_KEY_ID:-}
      DYNATA_SECRET: ${DYNATA_SECRET:-}
      DYNATA_API_URL: ${DYNATA_API_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    networks: [default, edge]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      target: web
    restart: unless-stopped
    networks: [default, edge]
    depends_on:
      - api

networks:
  edge:
    external: true

volumes:
  db-data:
