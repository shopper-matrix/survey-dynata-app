<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Floor plan of a supermarket with six areas">
  <!-- Demo floor plan for the click-map question. Zones match demo-survey.ts (percent of size). -->
  <style>
    rect { fill: #f5f5f5; stroke: #737373; stroke-width: 2; }
    text { font: 600 18px system-ui, sans-serif; fill: #262626; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="198" height="200" />
  <text x="99" y="96">Entrance,</text>
  <text x="99" y="120">fruit and veg</text>
  <rect x="198" y="0" width="204" height="200" />
  <text x="300" y="96">Muesli and</text>
  <text x="300" y="120">cereals</text>
  <rect x="402" y="0" width="198" height="200" />
  <text x="501" y="108">Sweets</text>
  <rect x="0" y="200" width="198" height="200" />
  <text x="99" y="296">Sports</text>
  <text x="99" y="320">nutrition</text>
  <rect x="198" y="200" width="204" height="200" />
  <text x="300" y="308">Drinks</text>
  <rect x="402" y="200" width="198" height="200" />
  <text x="501" y="308">Checkout</text>
</svg>
