name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Throwaway database for migrations and DB tests; exists only for this job, so the
    # credentials below are not secrets.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: survey_dynata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d survey_dynata_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/survey_dynata_ci
      APP_BASE_URL: http://localhost:5173
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @survey-dynata/api db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations (as in production)
        run: pnpm db:deploy
      - name: Database tests
        run: pnpm --filter @survey-dynata/api test:db
      - run: pnpm build
