name: Deploy

# After CI passes on a push (DSA-801, DSA-804): main deploys to production, dev to staging, both
# on the same server. deploy/deploy.sh backs up the database, starts the new version and checks
# it; an unhealthy version is rolled back. Can also be started by hand on main or dev
# (Actions > Deploy > Run workflow). Needs the repository secrets DEPLOY_HOST, DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS (docs/runbook.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Back up and deploy to ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'dev')) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}

    # One deploy per environment at a time; a newer one waits instead of interrupting.
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false

    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STACK_DIR: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '/opt/survey' || '/opt/survey-staging' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Package release
        run: git archive --format=tar.gz -o release.tar.gz HEAD

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and unpack
        run: |
          RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-${SHA::7}"
          echo "RELEASE_DIR=$STACK_DIR/releases/$RELEASE" >> "$GITHUB_ENV"
          scp -i ~/.ssh/deploy_key release.tar.gz "root@$DEPLOY_HOST:/tmp/release-$RELEASE.tar.gz"
          ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" \
            "set -e; mkdir -p $STACK_DIR/releases/$RELEASE; tar -xzf /tmp/release-$RELEASE.tar.gz -C $STACK_DIR/releases/$RELEASE; rm /tmp/release-$RELEASE.tar.gz"

      - name: Back up database, deploy, health check
        run: ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "bash $RELEASE_DIR/deploy/deploy.sh $RELEASE_DIR"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
