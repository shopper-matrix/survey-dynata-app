name: survey-dynata-app

# Local development environment: `docker compose up`
# Settings come from `.env` (copy `.env.example`); Compose stops with an error if a required one
# is missing.
#
# The repo is bind-mounted into the containers for hot reload. Each node_modules folder is an
# anonymous volume so the container keeps its own Linux-built dependencies.
x-node-app: &node-app
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/web/node_modules
    - /app/apps/api/node_modules
    - /app/packages/shared/node_modules

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-survey_dynata}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    <<: *node-app
    # Generate the Prisma client and apply pending migrations before starting the dev server.
    command: sh -c "pnpm db:generate && pnpm db:deploy && pnpm --filter @survey-dynata/api dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}@db:5432/${POSTGRES_DB:-survey_dynata}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DYNATA_MODE: ${DYNATA_MODE:-mock}
      DYNATA_KEY_ID: ${DYNATA_KEY_ID:-}
      DYNATA_SECRET: ${DYNATA_SECRET:-}
      DYNATA_API_URL: ${DYNATA_API_URL:-}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *node-app
    command: pnpm --filter @survey-dynata/web dev
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_USE_POLLING: 'true'
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      - api

volumes:
  db-data:
